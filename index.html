<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Chez Theo — 一个可以慢慢探索的手绘房间。">
  <title>Chez Theo</title>
  <link rel="stylesheet" href="styles.css?v=20261102-2">
</head>
<body>
  <main class="site-shell" aria-label="Chez Theo 的手绘房间">
    <div class="room" id="room">
      <div class="artboard" id="artboard">
        <img class="layer background" data-scene="background" src="assets/background.png" alt="手绘房间背景">
        <img class="layer racket-layer" data-scene="racket" src="assets/racket.png" alt="" aria-hidden="true">
        <img class="layer tennis-layer" id="tennisLayer" data-scene="tennis" src="assets/tennis.png" alt="" aria-hidden="true">
        <img class="layer chandelier-layer" data-scene="chandelier" src="assets/chandelier.png" alt="" aria-hidden="true">
        <img class="layer" data-scene="floorLamp" src="assets/floor-lamp.png" alt="" aria-hidden="true">
        <img class="layer" data-scene="furniture" src="assets/furniture.png" alt="" aria-hidden="true">
        <img class="layer" data-scene="flowers" src="assets/flowers.png" alt="" aria-hidden="true">
        <img class="layer" data-scene="glass" src="assets/glass.png" alt="" aria-hidden="true">
        <div class="object-visual computer-visual" id="computerVisual" aria-hidden="true">
          <img class="layer computer-day" id="computerDayLayer" data-scene="computerDay" src="assets/computer-day.png" alt="">
          <img class="layer computer-night" data-scene="computerNight" src="assets/computer-night.png" alt="">
        </div>
        <img class="layer object-visual" id="diaryVisual" data-scene="diary" src="assets/diary.png?v=20261102-2" alt="" aria-hidden="true">
        <img class="layer" data-scene="candlestick" src="assets/candlestick.png?v=20261102-2" alt="" aria-hidden="true">
        <img class="layer object-visual" id="paintingVisual" data-scene="painting" src="assets/painting.png" alt="" aria-hidden="true">

        <img class="layer night-wash" id="nightWash" data-scene="nightStart" src="assets/night-shadow-1.png" alt="" aria-hidden="true">
        <img class="layer night-wash night-end" data-scene="nightEnd" src="assets/night-shadow-2.png" alt="" aria-hidden="true">

        <img class="layer lighting-layer" id="floorLight" data-scene="floorEmission" src="assets/floor-emission.png" alt="" aria-hidden="true">
        <img class="layer lighting-layer floor-environment" data-scene="floorEnvironment" src="assets/floor-light-shadow.png" alt="" aria-hidden="true">
        <img class="layer lighting-layer" data-scene="haloOne" src="assets/candle-halo-1.png" alt="" aria-hidden="true">
        <img class="layer lighting-layer" data-scene="haloTwo" src="assets/candle-halo-2.png" alt="" aria-hidden="true">
        <img class="layer lighting-layer" data-scene="flames" src="assets/candle-flame.png" alt="" aria-hidden="true">
        <img class="layer lighting-layer chandelier-environment" id="chandelierLight" data-scene="chandelierGlow" src="assets/chandelier-glow.png" alt="" aria-hidden="true">

        <canvas class="scene-canvas" id="sceneCanvas" aria-hidden="true"></canvas>

        <button class="object-control" id="tennisButton" type="button" aria-label="让网球弹出房间"></button>
        <button class="object-control project" id="computerButton" type="button" data-object="computer" data-project="电脑" aria-label="打开电脑"></button>
        <button class="object-control project" id="diaryButton" type="button" data-object="diary" data-project="少女心事" aria-label="打开少女心事"></button>
        <button class="object-control project" id="paintingButton" type="button" data-object="painting" data-project="画" aria-label="打开画作"></button>
      </div>
    </div>

    <div class="brand" aria-label="Chez Theo"><img src="assets/logo.jpg" alt="Chez Theo 手绘桃子标志"></div>
    <div class="time-state" id="timeState" aria-live="polite">白天</div>
    <p class="hint" id="hint">房间里的物件可以点击</p>
  </main>

  <dialog class="project-dialog" id="projectDialog">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭">×</button>
    <p class="eyebrow">chez theo · collection</p>
    <h1 id="dialogTitle"></h1>
    <p>作品正在整理中，很快会住进这个房间。</p>
  </dialog>

  <div class="wind-cursor" id="windCursor" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 10c1-5 10-7 14-2M19 8c3 5-2 11-7 11M12 19c-6 0-8-7-4-10M8 9c4-4 10 2 6 6M14 15c-3 3-7-2-3-4"/></svg></div>
  <script src="room-state.js?v=20261102-2"></script>
  <script src="object-interactions.js?v=20261102-2"></script>
  <script src="scene-renderer.js?v=20261102-2"></script>
  <script src="script.js?v=20261102-2"></script>
</body>
</html>
