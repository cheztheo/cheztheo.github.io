<body>
<main class="page"><aside class="side"><a class="back" href="https://cheztheo.github.io/" aria-label="返回"><svg viewBox="0 0 36 48" aria-hidden="true"><polyline points="30,4 8,24 30,44"/></svg></a><nav class="places" id="places" aria-label="影集"><button type="button" class="about-link" id="aboutLink" data-place="about">关于</button><div class="place-list" id="placeList"></div></nav></aside><section class="gallery" id="gallery" aria-label="照片浏览"><div class="language" aria-label="Language"><button type="button" id="zh" aria-pressed="true">中</button><span>/</span><button type="button" id="en" aria-pressed="false">EN</button></div><div class="track" id="track"></div><article class="about-panel" id="aboutPanel" hidden><figure class="about-photo"><img src="about-portrait.webp" id="aboutPhoto" alt="树荫下站在河边的人"></figure><p class="about-copy"><span class="about-line">这个影集收录了从2021年开始摄影到今天的一些作品，</span><span class="about-line">有的是旅行中的兴奋，有的是生活中的惊喜发现，总之是一些感觉活着真好的时刻。</span></p></article></section><button class="nav prev" id="prev" aria-label="上一张">‹</button><button class="nav next" id="next" aria-label="下一张">›</button></main>
<section class="color-editor" id="colorEditor" aria-label="地名配色" hidden><button type="button" class="color-editor-close" id="colorEditorClose" aria-label="关闭配色">×</button><h2>自己选择颜色</h2><p>选择地名，再点色板；小色块可以自定义颜色。</p><div id="colorEditorRows"></div><div class="color-palette-grid" id="colorPaletteGrid" aria-label="RGB 色板"></div><div class="color-editor-actions"><button type="button" id="copyColors">复制 RGB 清单</button><button type="button" id="resetColors">恢复原色</button></div><div class="color-editor-status" id="colorEditorStatus" role="status"></div></section>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="放大照片"><button class="close" id="close" aria-label="关闭">×</button><button class="zoom-nav zoom-prev" id="zoomPrev" aria-label="上一张">上一张</button><figure><img id="zoomImg" alt="放大照片"><figcaption id="zoomCaption"></figcaption></figure><button class="zoom-nav zoom-next" id="zoomNext" aria-label="下一张">下一张</button></div>

  <div class="fog-glass" id="fogGlass" aria-hidden="true"></div>
  <div class="fog-brush-cursor" id="fogBrushCursor" hidden aria-hidden="true"></div>
  <div class="fog-instruction" aria-hidden="true"><span>轻点或擦拭 / Tap or wipe</span></div>
  <button class="fog-skip" id="fogSkip" type="button" aria-label="跳过雾面效果">跳过</button>

    <div class="fog-editor-title">在灰尘上写字</div>
    <label class="fog-brush-control" for="fogBrushSize"><span>画笔大小</span><input id="fogBrushSize" type="range" min="8" max="50" step="1" value="21"><output id="fogBrushSizeValue" for="fogBrushSize">21 px</output></label>

      <button type="button" id="fogUndo">撤销一笔</button>
      <button type="button" id="fogReset">清空重画</button>
      <button type="button" id="fogSave">保存并预览</button>
      <button type="button" id="fogExport">下载笔迹</button>
    </div>
    <p id="fogEditorStatus" role="status">保存后刷新仍能看见；将下载的笔迹文件发给我，就能固定在预览网站中。</p>
  </div>
</div>

<script>

  zakynthos:{name:{zh:'扎金索斯',en:'ZAKYNTHOS'},photos:[

  ]},
  hooke:{name:{zh:'Hooke Park',en:'HOOKE PARK'},photos:[
    {src:'hooke-interior.avif',caption:{zh:'晨间时光·2025',en:'Morning Hours · 2025'}},
    {src:'hooke-forest.avif',caption:{zh:'上学路上·2025',en:'On the Way to School · 2025'}},
    {src:'hooke-tulips.avif',caption:{zh:'窗边的郁金香·2025',en:'Tulips by the Window · 2025'}},
    {src:'hooke-pond-tree.avif',caption:{zh:'王小鸭的后院·2025',en:'Wang Xiaoya’s Backyard · 2025'}},
    {src:'hooke-window.avif',caption:{zh:'工位·2025',en:'Workspace · 2025'}},
    {src:'hooke-fields.avif',caption:{zh:'云下的田野·2025',en:'Fields Beneath the Clouds · 2025'}},
    {src:'hooke-pond-frost.jpg',caption:{zh:'王小鸭的家·2025',en:'Wang Xiaoya’s Home · 2025'}},
    {src:'hooke-snow-horse.avif',caption:{zh:'雪地里的马·2025',en:'Horse in the Snow · 2025'}},

  ]}
};
const placeOrder=['xinjiang','tromso','iceland','london','venice','zakynthos','hooke'];
const placeColors={xinjiang:'rgb(117,117,31)',tromso:'rgb(110,75,145)',iceland:'rgb(43,122,161)',london:'rgb(168,94,21)',venice:'rgb(229,159,148)',zakynthos:'rgb(47,156,213)',hooke:'rgb(25,108,57)'};
const ui={zh:{back:'返回',previous:'上一张',next:'下一张',close:'关闭',gallery:'照片浏览',albums:'影集',about:'关于',photo:'树荫下站在河边的人'},en:{back:'Back',previous:'Previous photo',next:'Next photo',close:'Close',gallery:'Photo gallery',albums:'Albums',about:'About',photo:'A person beside the river beneath the trees'}};
const track=document.querySelector('#track'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),lightbox=document.querySelector('#lightbox'),zoomImg=document.querySelector('#zoomImg');
let activePlace=location.hash==='#about'?'about':albums[location.hash.slice(1)]?location.hash.slice(1):'about',i=0,language='zh';
function go(n){
  if(activePlace==='about')return;
  const cards=[...track.querySelectorAll('.card')],photos=albums[activePlace].photos;
  i=Math.max(0,Math.min(photos.length-1,n));
  track.style.transform='translateX(-'+(cards[i].offsetLeft-cards[0].offsetLeft)+'px)';
  prev.disabled=document.querySelector('#zoomPrev').disabled=i===0;
  next.disabled=document.querySelector('#zoomNext').disabled=i===photos.length-1;
  zoomImg.src=photos[i].src;zoomImg.alt=photos[i].caption[language];
  document.querySelector('#zoomCaption').textContent=photos[i].caption[language];
  requestAnimationFrame(updateNavContrast);
}
function updateNavContrast(){
  const images=[...track.querySelectorAll('.card img')];
  for(const nav of [prev,next]){
    const box=nav.getBoundingClientRect(),x=box.left+box.width/2,y=box.top+box.height/2;
    const overPhoto=images.some(image=>{const r=image.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom});
    nav.classList.toggle('on-white',!overPhoto);
  }
}
track.addEventListener('transitionend',updateNavContrast);
function render(){
  const about=activePlace==='about',aboutPanel=document.querySelector('#aboutPanel');
  const displayLanguage=about?'zh':language;
  document.documentElement.lang=displayLanguage==='zh'?'zh-CN':'en';
  document.querySelector('#gallery').classList.toggle('is-about',about);
  const aboutLink=document.querySelector('#aboutLink');
  aboutLink.textContent=ui[displayLanguage].about;
  aboutLink.classList.toggle('active',about);
  aboutLink.setAttribute('aria-pressed',about);
  document.querySelector('#placeList').innerHTML=placeOrder.map(key=>[key,albums[key]]).map(([key,album])=>'<button type="button" data-place="'+key+'" class="'+(key===activePlace?'active':'')+'"'+(placeColors[key]?' style="--place-color:'+placeColors[key]+'"':'')+' aria-pressed="'+(key===activePlace)+'">'+album.name[displayLanguage]+'</button>').join('');
  aboutPanel.hidden=!about;track.hidden=about;
  document.querySelector('#aboutPhoto').alt=ui.zh.photo;
  if(!about){
    track.style.transition='none';track.style.transform='none';
    track.innerHTML=albums[activePlace].photos.map((photo,index)=>'<figure class="card"><img src="'+photo.src+'" alt="'+photo.caption[language]+'" data-index="'+index+'"><figcaption class="caption">'+photo.caption[language]+'</figcaption></figure>').join('');
    track.querySelectorAll('img').forEach(image=>image.addEventListener('load',()=>go(i)));
  }
  document.querySelector('#zh').setAttribute('aria-pressed',language==='zh');document.querySelector('#en').setAttribute('aria-pressed',language==='en');
  document.querySelector('.back').setAttribute('aria-label',ui[language].back);document.querySelector('#places').setAttribute('aria-label',ui[language].albums);
  document.querySelector('#gallery').setAttribute('aria-label',about?ui[language].about:albums[activePlace].name[language]+' · '+ui[language].gallery);
  prev.setAttribute('aria-label',ui[language].previous);next.setAttribute('aria-label',ui[language].next);
  document.querySelector('#zoomPrev').setAttribute('aria-label',ui[language].previous);document.querySelector('#zoomNext').setAttribute('aria-label',ui[language].next);
  document.querySelector('#close').setAttribute('aria-label',ui[language].close);
  if(about){prev.disabled=next.disabled=true}
  else{go(i);requestAnimationFrame(()=>{track.style.transition='transform .35s ease'})}
}
document.querySelector('#places').onclick=event=>{const button=event.target.closest('button[data-place]');if(!button)return;activePlace=button.dataset.place;i=0;lightbox.classList.remove('show');location.hash=activePlace;render()};
window.addEventListener('hashchange',()=>{const place=location.hash.slice(1);if((place==='about'||albums[place])&&place!==activePlace){activePlace=place;i=0;lightbox.classList.remove('show');render()}});
document.querySelector('#zh').onclick=()=>{language='zh';render()};document.querySelector('#en').onclick=()=>{language='en';render()};
prev.onclick=document.querySelector('#zoomPrev').onclick=()=>go(i-1);next.onclick=document.querySelector('#zoomNext').onclick=()=>go(i+1);
track.onclick=event=>{const image=event.target.closest('img[data-index]');if(!image)return;go(Number(image.dataset.index));lightbox.classList.add('show')};
document.querySelector('#close').onclick=()=>lightbox.classList.remove('show');lightbox.onclick=event=>{if(event.target===lightbox)lightbox.classList.remove('show')};
document.onkeydown=event=>{if(event.key==='ArrowLeft')go(i-1);if(event.key==='ArrowRight')go(i+1);if(event.key==='Escape')lightbox.classList.remove('show')};
window.addEventListener('resize',()=>go(i));render();
</script>
