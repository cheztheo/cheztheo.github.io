<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chez Theo · Photography</title><style>*{box-sizing:border-box}body{margin:0;color:#5c5c5c;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.page{min-height:100vh;display:grid;grid-template-columns:16.6667% 83.3333%}.side{border-right:1px solid #eee;position:relative}.back{position:absolute;top:22px;left:30px;width:36px;height:48px;display:flex;align-items:center;justify-content:center}.back svg{width:80%;height:80%;fill:none;stroke:#555;stroke-width:1.5}.places{position:absolute;top:50%;width:100%;transform:translateY(-50%);text-align:center;font-size:12px;line-height:2.65;color:#b4b4b4}.places button{display:block;width:100%;border:0;background:none;color:inherit;font:inherit;cursor:pointer}.places .active{color:#777}.gallery{padding:18vh 5.2vw 40px 20px;overflow:hidden}.track{display:flex;gap:20px;transition:transform .35s}.card{flex:0 0 auto;margin:0}.card img{display:block;height:64vh;width:auto}.caption{font-size:11px;letter-spacing:.08em;color:#aaa;margin-top:18px}.nav{position:fixed;top:50%;width:20px;height:20px;border:0;border-top:1px solid #555;border-left:1px solid #555;background:none;font-size:0;cursor:pointer}.nav:disabled{display:none}.prev{left:calc(16.6667% + 36px);transform:translateY(-50%) rotate(-45deg)}.next{right:5%;transform:translateY(-50%) rotate(135deg)}@media(max-width:700px){.page{grid-template-columns:26% 74%}.back{left:14px}.gallery{padding:21vh 14px 40px 20px}.card img{height:58vh}.prev{left:calc(26% + 36px)}}.language{position:fixed;top:23px;right:5.2vw;font-size:12px;color:#aaa}.empty-note{font-size:12px;color:#aaa;margin-top:15vh}.language button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}.language button:hover{text-decoration:underline}</style></head><body><main class="page"><aside class="side"><a class="back" href="../" aria-label="返回"><svg viewBox="0 0 36 48"><polyline points="30,4 8,24 30,44"/></svg></a><nav class="places" aria-label="影集"><button class="active">新疆</button><button class="">特罗姆瑟</button><button class="">雷克雅未克</button><button class="">伦敦</button><button class="">威尼斯</button><button class="">扎金索斯</button><button class="">Hooke Park</button></nav></aside><section class="gallery" aria-label="新疆 · 照片浏览"><div class="language">中&nbsp; / &nbsp;EN</div><div class="track" id="track"></div><p class="empty-note" id="emptyNote" hidden>该相册的照片正在整理中</p></section><button class="nav prev" id="prev" aria-label="上一张" disabled>‹</button><button class="nav next" id="next" aria-label="下一张">›</button></main><script>
const albums=[{"key":"xinjiang","name":"新疆","en":"Xinjiang","year":"2021","names":["Xinjiang","BAE37294","ti-qiu-xiao-hai-9"],"images":["images/xinjiang/Xinjiang.jpg","images/xinjiang/BAE37294.jpg","images/xinjiang/ti-qiu-xiao-hai-9.jpg"]},{"key":"tromso","name":"特罗姆瑟","en":"Tromsø","year":"2024","names":["DSC03700","IMG-8131","IMG-8354"],"images":["images/tromso/DSC03700.jpg","images/tromso/IMG-8131.jpg","images/tromso/IMG-8354.jpg"]},{"key":"reykjavik","name":"雷克雅未克","en":"Reykjavík","year":"2025","names":["IMG-1400","IMG-2112","IMG-2194","IMG-8492","IMG-8592","IMG-8703","DSC03736","DSC03751","DSC03754-2","DSC03775","IMG-8367"],"images":["images/reykjavik/IMG-1400.jpg","images/reykjavik/IMG-2112.jpg","images/reykjavik/IMG-2194.jpg","images/reykjavik/IMG-8492.jpg","images/reykjavik/IMG-8592.jpg","images/reykjavik/IMG-8703.jpg","images/reykjavik/DSC03736.jpg","images/reykjavik/DSC03751.jpg","images/reykjavik/DSC03754-2.jpg","images/reykjavik/DSC03775.jpg","images/reykjavik/IMG-8367.jpg"]},{"key":"london","name":"伦敦","en":"London","year":"2025","names":["451372C3","IMG-0859","IMG-2406","IMG-3716","IMG-3973"],"images":["images/london/451372C3.jpg","images/london/IMG-0859.jpg","images/london/IMG-2406.jpg","images/london/IMG-3716.jpg","images/london/IMG-3973.jpg"]},{"key":"venice","name":"威尼斯","en":"Venice","year":"2025","names":["IMG-1694","IMG-1740","IMG-1887"],"images":["images/venice/IMG-1694.jpg","images/venice/IMG-1740.jpg","images/venice/IMG-1887.jpg"]},{"key":"zakynthos","name":"扎金索斯","en":"Zakynthos","year":"2025","names":[],"images":[]},{"key":"hooke-park","name":"Hooke Park","en":"Hooke Park","year":"2025","names":["IMG-0014","IMG-0604-2","IMG-1321","IMG-4286-2","IMG-4420-2","IMG-5097","IMG-6396","IMG-6399-2","IMG-7253-2","IMG-9592"],"images":["images/hooke-park/IMG-0014.jpg","images/hooke-park/IMG-0604-2.jpg","images/hooke-park/IMG-1321.jpg","images/hooke-park/IMG-4286-2.jpg","images/hooke-park/IMG-4420-2.jpg","images/hooke-park/IMG-5097.jpg","images/hooke-park/IMG-6396.jpg","images/hooke-park/IMG-6399-2.jpg","images/hooke-park/IMG-7253-2.jpg","images/hooke-park/IMG-9592.jpg"]}];
const buttons=[...document.querySelectorAll(".places button")];
const track=document.getElementById("track"),gallery=document.querySelector(".gallery");
const prev=document.getElementById("prev"),next=document.getElementById("next"),empty=document.getElementById("emptyNote");
let albumIndex=0,photoIndex=0,english=false;
function updatePosition(){
 const cards=[...track.children];
 const active=cards[photoIndex];
 track.style.transform=active?"translateX(-"+(active.offsetLeft-cards[0].offsetLeft)+"px)":"none";
 prev.disabled=photoIndex===0;next.disabled=photoIndex>=cards.length-1;
}
function showAlbum(index){
 albumIndex=index;photoIndex=0;const album=albums[index];
 buttons.forEach((button,n)=>{button.classList.toggle("active",n===index);button.setAttribute("aria-current",n===index?"true":"false");button.textContent=english?albums[n].en:albums[n].name});
 gallery.setAttribute("aria-label",album.name+" · 照片浏览");
 track.replaceChildren();
 album.images.forEach((src,n)=>{
  const figure=document.createElement("figure");figure.className="card";
  const img=document.createElement("img");img.src=src;img.alt=album.name+" "+(n+1);img.loading="eager";img.addEventListener("load",updatePosition);
  const caption=document.createElement("figcaption");caption.className="caption";caption.textContent=(english?album.en:album.name)+" · "+album.year+" · "+String(n+1).padStart(2,"0");
  figure.append(img,caption);track.append(figure);
 });
 empty.hidden=album.images.length>0;track.style.display=album.images.length?"flex":"none";
 requestAnimationFrame(updatePosition);
}
buttons.forEach((b,n)=>b.addEventListener("click",()=>showAlbum(n)));
prev.addEventListener("click",()=>{photoIndex=Math.max(0,photoIndex-1);updatePosition()});
next.addEventListener("click",()=>{photoIndex=Math.min(track.children.length-1,photoIndex+1);updatePosition()});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&!next.disabled)next.click();if(e.key==="ArrowLeft"&&!prev.disabled)prev.click()});
window.addEventListener("resize",updatePosition);
document.querySelector(".language").innerHTML='<button type="button" id="langZh">中</button> / <button type="button" id="langEn">EN</button>';
document.querySelectorAll(".language button").forEach((b,n)=>b.addEventListener("click",()=>{english=Boolean(n);showAlbum(albumIndex)}));
showAlbum(0);
</script></body></html>
