<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#5c5c5c;font-family:Georgia,"Times New Roman",serif}.page{min-height:100vh;display:grid;grid-template-columns:16.6667% 83.3333%;position:relative}.side{padding:26px 34px;border-right:1px solid #f0f0f0;min-height:100vh;position:relative}.back{position:absolute;top:26px;left:34px;display:inline-flex;color:#777;text-decoration:none;font-family:Arial,sans-serif;font-size:25px;font-weight:300;line-height:1}.places{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:12px;letter-spacing:.06em;line-height:2.65;color:#b4b4b4}.places .active{color:#777}.gallery{padding:50px 5.2vw 40px 4.1vw;overflow:hidden;position:relative}.track{display:flex;gap:30px;align-items:flex-start;transition:transform .35s ease}.card{min-width:76%;margin:0}.card img{display:block;width:100%;height:64vh;object-fit:cover;cursor:zoom-in}.caption{font-size:11px;letter-spacing:.08em;color:#aaa;margin-top:18px}.nav{position:fixed;top:50%;z-index:2;width:20px;height:20px;border:0;border-top:1px solid #fff;border-left:1px solid #fff;background:transparent;cursor:pointer;padding:0;font-size:0;opacity:1}.nav[disabled]{display:none}.prev{left:22%;transform:translateY(-50%) rotate(-45deg)}.next{right:5%;transform:translateY(-50%) rotate(135deg)}.lightbox{display:none;position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:5;align-items:center;justify-content:center}.lightbox.show{display:flex}.lightbox img{max-width:88vw;max-height:88vh;object-fit:contain}.close{position:absolute;top:25px;right:35px;border:0;background:none;font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:300;color:#777;cursor:pointer}@media(max-width:700px){.page{grid-template-columns:26% 74%}.side{padding:22px 14px}.back{top:22px;left:14px}.gallery{padding:54px 14px}.card{min-width:100%}.card img{height:58vh}.prev{left:30%}.next{right:7%}}
/* Keep the back arrow in the corner while the place names sit in the center. */
.language{position:absolute;z-index:3;top:23px;right:5.2vw;display:flex;gap:8px;align-items:center;font:12px/1.2 Arial,sans-serif;letter-spacing:.06em;color:#bbb}.language button{padding:2px 0;border:0;background:none;color:#aaa;font:inherit;cursor:pointer}.language button[aria-pressed="true"]{color:#4e4e4e}@media(max-width:700px){.language{right:14px}}
.lightbox figure{margin:0;max-width:88vw}.lightbox figcaption{margin-top:14px;color:#aaa;font:11px/1.5 Arial,sans-serif;letter-spacing:.08em}.zoom-nav{position:absolute;top:50%;width:20px;height:20px;padding:0;border:0;border-top:1px solid #555;border-left:1px solid #555;background:none;font-size:0}.zoom-nav[disabled]{display:none}.zoom-prev{left:4%;transform:rotate(-45deg)}.zoom-next{right:4%;transform:rotate(135deg)}
.gallery{padding-top:18vh} @media(max-width:700px){.gallery{padding-top:21vh}}
body,.back,.places,.caption,.language,.language button,.lightbox figcaption,.close{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.places button{display:block;width:100%;padding:0 6px;border:0;background:none;color:#b4b4b4;font:inherit;letter-spacing:inherit;line-height:inherit;cursor:pointer}.places button.active{color:#777}.card{flex:0 0 76%}@media(max-width:700px){.card{flex-basis:100%}}
.track{gap:20px}
.nav.on-white{border-color:#555}
.card{flex:0 0 auto;min-width:0;width:max-content}
.card img{width:auto;height:64vh;max-width:none;object-fit:contain}
.caption{max-width:100%}
@media(max-width:700px){.card{flex:0 0 auto;min-width:0}.card img{width:auto;height:58vh;max-width:none}}
.gallery{padding-left:20px}
.back{top:22px;left:30px;width:36px;height:48px;line-height:0;font-size:0}
.back svg{display:block;width:100%;height:100%;fill:none;stroke:#5b5b5b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.back{align-items:center;justify-content:center}.back svg{width:80%;height:80%}
.places{height:42.6667vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:safe center;align-items:stretch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#ddd transparent}
.places button{flex:none}
.prev{left:calc(16.6667% + 36px)}
@media(max-width:700px){.gallery{padding-left:20px}.places{height:38.6667vh}.back{top:18px;left:14px}.prev{left:calc(26% + 36px)}}
</style></head>
<body>
<main class="page"><aside class="side"><a class="back" href="../" aria-label="返回"><svg viewBox="0 0 36 48" aria-hidden="true"><polyline points="30,4 8,24 30,44"/></svg></a><nav class="places" id="places" aria-label="影集"></nav></aside><section class="gallery" id="gallery" aria-label="照片浏览"><div class="language" aria-label="Language"><button type="button" id="zh" aria-pressed="true">中</button><span>/</span><button type="button" id="en" aria-pressed="false">EN</button></div><div class="track" id="track"></div></section><button class="nav prev" id="prev" aria-label="上一张">‹</button><button class="nav next" id="next" aria-label="下一张">›</button></main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="放大照片"><button class="close" id="close" aria-label="关闭">×</button><button class="zoom-nav zoom-prev" id="zoomPrev" aria-label="上一张">上一张</button><figure><img id="zoomImg" alt="放大照片"><figcaption id="zoomCaption"></figcaption></figure><button class="zoom-nav zoom-next" id="zoomNext" aria-label="下一张">下一张</button></div>
<div class="fog-intro" id="fogIntro" role="region" aria-label="擦拭雾面以探索摄影集" tabindex="0">
  <div class="fog-glass" id="fogGlass" aria-hidden="true"></div>
  <div class="fog-instruction" aria-hidden="true"><span>擦一擦，看看照片</span><small>按住滑动或用手指擦拭 · 点击也能揭开</small></div>
  <button class="fog-skip" id="fogSkip" type="button" aria-label="跳过雾面效果">跳过</button>
</div>
<noscript><style>.fog-intro{display:none}</style></noscript>
<script src="fog.js?v=20261112-2"></script>
<script>
const albums={
  xinjiang:{name:{zh:'新疆',en:'XINJIANG'},photos:[
    {src:'first.jpg',caption:{zh:'小女孩·2021',en:'Little Girl · 2021'}},
    {src:'dog-2021.jpg',caption:{zh:'雪山下的小狗·2021',en:'Dog Beneath the Snowy Mountains · 2021'}},
    {src:'lamb-2021.jpg',caption:{zh:'踢球的放牧男孩·2021',en:'Herding Boy Playing Football · 2021'}}
  ]},
  iceland:{name:{zh:'雷克雅未克',en:'REYKJAVÍK'},photos:[
    {src:'iceland-steam-2024.jpg',caption:{zh:'雪地上的奇异蒸汽·2025',en:'Strange Steam in the Snow · 2025'}},
    {src:'iceland-black-sand-2024.jpg',caption:{zh:'我有一颗好大的钻·2025',en:'I Have Such a Big Diamond · 2025'}},
    {src:'iceland-ice-cave-2024.jpg',caption:{zh:'蓝色冰洞·2025',en:'Blue Ice Cave · 2025'}},
    {src:'iceland-town-2024.jpg',caption:{zh:'冬日街景·2025',en:'Winter Street · 2025'}},
    {src:'iceland-snow-light-2024.jpg',caption:{zh:'雪地里的灯光·2025',en:'Light in the Snow · 2025'}},
    {src:'iceland-coast-2024.jpg',caption:{zh:'海边的岩石·2025',en:'Rocks by the Sea · 2025'}},
    {src:'reykjavik-vehicles-2024.jpg',caption:{zh:'雪地上的车队·2025',en:'Vehicles in the Snow · 2025'}},
    {src:'reykjavik-steam-2024.jpg',caption:{zh:'雪地里的蒸汽·2025',en:'Steam in the Snow · 2025'}},
    {src:'reykjavik-dusk-2024.jpg',caption:{zh:'暮色中的停车场·2025',en:'Parking Lot at Dusk · 2025'}},
    {src:'reykjavik-snow-mountain-2024.jpg',caption:{zh:'落日下的雪山·2025',en:'Snowy Mountains at Sunset · 2025'}},
    {src:'reykjavik-snow-road-2024.avif',caption:{zh:'雪中的弯路·2025',en:'Winding Road in the Snow · 2025'}}
  ]},
  tromso:{name:{zh:'特罗姆瑟',en:'TROMSØ'},photos:[

    {src:'tromso-snow-lights.jpg',caption:{zh:'雪地里的紫色灯光·2024',en:'Purple Light on the Snow · 2024'}},
    {src:'tromso-night-view.jpg',caption:{zh:'夜色里的山城·2024',en:'City Lights at Night · 2024'}},
    {src:'tromso-bay-at-night.jpg',caption:{zh:'夜色下的港湾·2024',en:'Harbor at Night · 2024'}}
  ]},
  london:{name:{zh:'伦敦',en:'LONDON'},photos:[
    {src:'london-swans.jpg',caption:{zh:'水面上的天鹅·2025',en:'Swans on the Water · 2025'}},
    {src:'london-steps.avif',caption:{zh:'台阶上的行人·2025',en:'People on the Steps · 2025'}},
    {src:'london-lights.avif',caption:{zh:'一墙灯光·2025',en:'A Wall of Lights · 2025'}},
    {src:'london-fountain-near.avif',caption:{zh:'树影里的喷泉·2025',en:'Fountain Among the Trees · 2025'}},
    {src:'london-fountain-far.avif',caption:{zh:'远处的喷泉·2025',en:'Fountain in the Distance · 2025'}},
    {src:'london-sunlit-street.jpg',caption:{zh:'夕阳下的街角·2025',en:'Street Corner in the Evening Sun · 2025'}}
  ]},
  venice:{name:{zh:'威尼斯',en:'VENICE'},photos:[
    {src:'venice-gondola-2025.jpg',caption:{zh:'贡多拉与帆船·2025',en:'Gondola and Sailboat · 2025'}},
    {src:'venice-canal-2025.jpg',caption:{zh:'运河一隅·2025',en:'A Corner of the Canal · 2025'}},
    {src:'venice-rainbow-2025.jpg',caption:{zh:'雨后的彩虹·2025',en:'Rainbow After the Rain · 2025'}}
  ]},
  zakynthos:{name:{zh:'扎金索斯',en:'ZAKYNTHOS'},photos:[
    {src:'zakynthos-bay-2025.jpg',caption:{zh:'蓝色海湾·2025',en:'Blue Bay · 2025'}},
    {src:'zakynthos-sunset-2025.jpg',caption:{zh:'日出街道·2025',en:'Street at Sunrise · 2025'}},
    {src:'zakynthos-market-2025.jpg',caption:{zh:'旧货市场·2025',en:'Flea Market · 2025'}},
    {src:'zakynthos-port-2025.jpg',caption:{zh:'港口的乌云·2025',en:'Clouds over the Port · 2025'}},
    {src:'zakynthos-marina-2025.jpg',caption:{zh:'黄昏的码头·2025',en:'Marina at Dusk · 2025'}},
    {src:'zakynthos-cave-2025.jpg',caption:{zh:'海蚀洞里的蓝·2025',en:'Blue Water in the Cave · 2025'}}
  ]},
  hooke:{name:{zh:'Hooke Park',en:'HOOKE PARK'},photos:[
    {src:'hooke-interior.avif',caption:{zh:'室内的一角·2025',en:'A Corner Indoors · 2025'}},
    {src:'hooke-forest.avif',caption:{zh:'林间的光·2025',en:'Light in the Woods · 2025'}},
    {src:'hooke-tulips.avif',caption:{zh:'窗边的郁金香·2025',en:'Tulips by the Window · 2025'}},
    {src:'hooke-pond-tree.avif',caption:{zh:'湖畔的树·2025',en:'Tree by the Water · 2025'}},
    {src:'hooke-window.avif',caption:{zh:'窗边的一角·2025',en:'By the Window · 2025'}},
    {src:'hooke-fields.avif',caption:{zh:'云下的田野·2025',en:'Fields Beneath the Clouds · 2025'}},
    {src:'hooke-pond-frost.jpg',caption:{zh:'结霜的池塘·2025',en:'Frost by the Pond · 2025'}},
    {src:'hooke-snow-horse.avif',caption:{zh:'雪地里的马·2025',en:'Horse in the Snow · 2025'}},
    {src:'hooke-bonfire.avif',caption:{zh:'林间篝火·2025',en:'Bonfire in the Woods · 2025'}},
    {src:'hooke-mist.avif',caption:{zh:'雾中的树影·2025',en:'Trees in the Mist · 2025'}},
    {src:'hooke-building.jpg',caption:{zh:'午后的屋顶·2025',en:'Rooftop in the Afternoon · 2025'}},
    {src:'hooke-sunlit-path.jpg',caption:{zh:'晨光里的小路·2025',en:'Path in the Morning Light · 2025'}}
  ]}
};
const placeOrder=['xinjiang','tromso','iceland','london','venice','zakynthos','hooke'];
const ui={zh:{back:'返回',previous:'上一张',next:'下一张',close:'关闭',gallery:'照片浏览',albums:'影集'},en:{back:'Back',previous:'Previous photo',next:'Next photo',close:'Close',gallery:'Photo gallery',albums:'Albums'}};
const track=document.querySelector('#track'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),lightbox=document.querySelector('#lightbox'),zoomImg=document.querySelector('#zoomImg');
let activePlace=albums[location.hash.slice(1)]?location.hash.slice(1):'xinjiang',i=0,language='zh';
function go(n){
  const cards=[...track.querySelectorAll('.card')],photos=albums[activePlace].photos;
  i=Math.max(0,Math.min(photos.length-1,n));
  track.style.transform='translateX(-'+(cards[i].offsetLeft-cards[0].offsetLeft)+'px)';
  prev.disabled=document.querySelector('#zoomPrev').disabled=i===0;
  next.disabled=document.querySelector('#zoomNext').disabled=i===photos.length-1;
  zoomImg.src=photos[i].src;zoomImg.alt=photos[i].caption[language];
  document.querySelector('#zoomCaption').textContent=photos[i].caption[language];
  requestAnimationFrame(updateNavContrast);
}
function updateNavContrast(){
  const images=[...track.querySelectorAll('.card img')];
  for(const nav of [prev,next]){
    const box=nav.getBoundingClientRect(),x=box.left+box.width/2,y=box.top+box.height/2;
    const overPhoto=images.some(image=>{const r=image.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom});
    nav.classList.toggle('on-white',!overPhoto);
  }
}
track.addEventListener('transitionend',updateNavContrast);
function render(){
  document.documentElement.lang=language==='zh'?'zh-CN':'en';
  document.querySelector('#places').innerHTML=placeOrder.map(key=>[key,albums[key]]).map(([key,album])=>'<button type="button" data-place="'+key+'" class="'+(key===activePlace?'active':'')+'" aria-pressed="'+(key===activePlace)+'">'+album.name[language]+'</button>').join('');
  track.style.transition='none';track.style.transform='none';
  track.innerHTML=albums[activePlace].photos.map((photo,index)=>'<figure class="card"><img src="'+photo.src+'" alt="'+photo.caption[language]+'" data-index="'+index+'"><figcaption class="caption">'+photo.caption[language]+'</figcaption></figure>').join('');
  track.querySelectorAll('img').forEach(image=>image.addEventListener('load',()=>go(i)));
  document.querySelector('#zh').setAttribute('aria-pressed',language==='zh');document.querySelector('#en').setAttribute('aria-pressed',language==='en');
  document.querySelector('.back').setAttribute('aria-label',ui[language].back);document.querySelector('#places').setAttribute('aria-label',ui[language].albums);
  document.querySelector('#gallery').setAttribute('aria-label',albums[activePlace].name[language]+' · '+ui[language].gallery);
  prev.setAttribute('aria-label',ui[language].previous);next.setAttribute('aria-label',ui[language].next);
  document.querySelector('#zoomPrev').setAttribute('aria-label',ui[language].previous);document.querySelector('#zoomNext').setAttribute('aria-label',ui[language].next);
  document.querySelector('#close').setAttribute('aria-label',ui[language].close);
  go(i);requestAnimationFrame(()=>{track.style.transition='transform .35s ease'});
}
document.querySelector('#places').onclick=event=>{const button=event.target.closest('button[data-place]');if(!button)return;activePlace=button.dataset.place;i=0;lightbox.classList.remove('show');location.hash=activePlace;render()};
window.addEventListener('hashchange',()=>{const place=location.hash.slice(1);if(albums[place]&&place!==activePlace){activePlace=place;i=0;lightbox.classList.remove('show');render()}});
document.querySelector('#zh').onclick=()=>{language='zh';render()};document.querySelector('#en').onclick=()=>{language='en';render()};
prev.onclick=document.querySelector('#zoomPrev').onclick=()=>go(i-1);next.onclick=document.querySelector('#zoomNext').onclick=()=>go(i+1);
track.onclick=event=>{const image=event.target.closest('img[data-index]');if(!image)return;go(Number(image.dataset.index));lightbox.classList.add('show')};
document.querySelector('#close').onclick=()=>lightbox.classList.remove('show');lightbox.onclick=event=>{if(event.target===lightbox)lightbox.classList.remove('show')};
document.onkeydown=event=>{if(event.key==='ArrowLeft')go(i-1);if(event.key==='ArrowRight')go(i+1);if(event.key==='Escape')lightbox.classList.remove('show')};
window.addEventListener('resize',()=>go(i));render();
</script>
</body></html>
