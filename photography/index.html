<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chez Theo · Photography</title><style>*{box-sizing:border-box}body{margin:0;color:#5c5c5c;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.page{min-height:100vh;display:grid;grid-template-columns:16.6667% 83.3333%}.side{border-right:1px solid #eee;position:relative}.back{position:absolute;top:22px;left:30px;width:36px;height:48px;display:flex;align-items:center;justify-content:center}.back svg{width:80%;height:80%;fill:none;stroke:#555;stroke-width:1.5}.places{position:absolute;top:50%;width:100%;transform:translateY(-50%);text-align:center;font-size:12px;line-height:2.65;color:#b4b4b4}.places button{display:block;width:100%;border:0;background:none;color:inherit;font:inherit;cursor:pointer}.places .active{color:#777}.gallery{padding:18vh 5.2vw 40px 20px;overflow:hidden}.track{display:flex;gap:20px;transition:transform .35s}.card{flex:0 0 auto;margin:0}.card img{display:block;height:64vh;width:auto}.caption{font-size:11px;letter-spacing:.08em;color:#aaa;margin-top:18px}.nav{position:fixed;top:50%;width:20px;height:20px;border:0;border-top:1px solid #555;border-left:1px solid #555;background:none;font-size:0;cursor:pointer}.nav:disabled{display:none}.prev{left:calc(16.6667% + 36px);transform:translateY(-50%) rotate(-45deg)}.next{right:5%;transform:translateY(-50%) rotate(135deg)}@media(max-width:700px){.page{grid-template-columns:26% 74%}.back{left:14px}.gallery{padding:21vh 14px 40px 20px}.card img{height:58vh}.prev{left:calc(26% + 36px)}}.language{position:fixed;top:23px;right:5.2vw;font-size:12px;color:#aaa}</style></head><body><main class="page"><aside class="side"><a class="back" href="../" aria-label="返回"><svg viewBox="0 0 36 48"><polyline points="30,4 8,24 30,44"/></svg></a><nav class="places" aria-label="影集"><button class="active">新疆</button><button class="">特罗姆瑟</button><button class="">雷克雅未克</button><button class="">伦敦</button><button class="">威尼斯</button><button class="">扎金索斯</button><button class="">Hooke Park</button></nav></aside><section class="gallery" aria-label="新疆 · 照片浏览"><div class="language">中&nbsp; / &nbsp;EN</div><div class="track" id="track"><figure class="card"><img src="first.jpg" alt="小女孩·2021"><figcaption class="caption">小女孩·2021</figcaption></figure><figure class="card"><img src="dog-2021.jpg" alt="雪山下的小狗·2021"><figcaption class="caption">雪山下的小狗·2021</figcaption></figure><figure class="card"><img src="lamb-2021.jpg" alt="踢球的放牧男孩·2021"><figcaption class="caption">踢球的放牧男孩·2021</figcaption></figure></div></section><button class="nav prev" id="prev" aria-label="上一张" disabled>‹</button><button class="nav next" id="next" aria-label="下一张">›</button></main><script>const t=document.querySelector("#track"),c=[...document.querySelectorAll(".card")];let i=0;function go(n){i=Math.max(0,Math.min(c.length-1,n));t.style.transform="translateX(-"+(c[i].offsetLeft-c[0].offsetLeft)+"px)";prev.disabled=i===0;next.disabled=i===c.length-1}prev.onclick=()=>go(i-1);next.onclick=()=>go(i+1)</script></body></html>
